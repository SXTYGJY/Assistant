# Doris BE Configuration File
# Memory optimizations for vector operations

# Memory limits
mem_limit = 80%

# Load memory limits (for bulk inserts like vector data)
load_process_max_memory_limit_percent = 60
load_process_max_memory_limit_bytes = 2147483648

# Query memory limits
query_mem_limit = 1073741824  # 1GB per query

# Stream load memory limits
stream_load_default_memory_limit = 1073741824  # 1GB for stream loads

# Check memory limits periodically
memory_maintenance_sleep_time_s = 10

# Enable memory tracking
enable_system_metrics = true
enable_metric_calculator = true

# Storage engine settings
storage_page_cache_limit = 2147483648  # 2GB page cache

# Compaction memory limits
max_compaction_memory_limit = 1073741824  # 1GB for compaction

# Brpc settings for better memory management
brpc_max_body_size = 2147483648  # 2GB max body size